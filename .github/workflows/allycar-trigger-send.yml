name: Allycar – Trigger Send (every 20 min)

on:
  schedule:
    # Roda a cada 20 minutos (UTC). O endpoint /trigger-send respeita o
    # horário comercial de cada país, então fora do horário ninguém recebe.
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  trigger_send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Allycar trigger endpoint
        run: |
          echo "Calling Allycar trigger-send..."
          curl -sS -L \
            -H "User-Agent: GitHubActions-Cron" \
            "https://allycar-agent-production.up.railway.app/agent/trigger-send"
          echo ""
          echo "Done."
