name: Allycar – Trigger Send (every 2h)

on:
  schedule:
    # GitHub Actions uses UTC
    # Brazil (UTC-3): 11, 13, 15, 17, 19
    # UTC:            14, 16, 18, 20, 22
    - cron: "0 14,16,18,20,22 * * *"
  workflow_dispatch:

jobs:
  trigger_send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Allycar trigger endpoint
        run: |
          echo "Calling Allycar trigger-send..."
          curl -sS -L \
            -H "User-Agent: GitHubActions-Cron" \
            "https://allycar-whatsapp-production.up.railway.app/trigger-send"
          echo ""
          echo "Done."
